name: Trigger Slingshot Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    
permissions:
  pull-requests: write
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for SonarQube analysis to complete
        run: sleep 90
        
      - name: Call Slingshot Workflow
        run: |
          http_status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://sapientaiproducts.com/save/api/v1/tasks/1d8a3c4b-56a9-46fc-b530-0714f5d4a748/runs" \
            -H "Authorization: Bearer ${{ secrets.SLINGSHOT_PAT }}" \
            -H "CLIENTID: b97fbef7-cad9-4e56-9850-39e86c8fdf61" \
            -H "PROJECTID: bf4069d7-dbe5-4cf5-ab47-dd8c3678b367" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d '{
              "runName": "PR #${{ github.event.pull_request.number }} review",
              "overrides": {
                "workflow": "2c4c9cf5-dbb2-4b61-8045-658e259bdfa7",
                "variables": {
                  "repoOwner": "${{ github.repository_owner }}",
                  "repoName": "${{ github.event.repository.name }}",
                  "prNumber": "${{ github.event.pull_request.number }}",
                  "targetBranch": "${{ github.event.pull_request.base.ref }}",
                  "sonarProjectKey": "AlekhyareddyPothula_Sample-Test",
                  "sonarOrgKey": "alekhya-reddy-pothula"
                }
              }
            }')
          echo "HTTP Status: $http_status"
          echo "Response:"
          cat response.json
          if [ "$http_status" -ge 400 ]; then
            echo "::error::Slingshot trigger failed with status $http_status"
            exit 1
          fi
